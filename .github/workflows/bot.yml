name: Crypto Bot
on:
  schedule:
    - cron: '1,16,31,46 * * * *'  # 정각 혼잡 피해서 1분씩 밀어서 실행
  workflow_dispatch:        # 수동으로도 실행 가능
permissions:
  contents: write  # state 파일을 다시 커밋하기 위해 write 권한 필요
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install ccxt requests pandas
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py --once
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_state.json
          git diff --staged --quiet || git commit -m "update alert state [skip ci]"
          git push

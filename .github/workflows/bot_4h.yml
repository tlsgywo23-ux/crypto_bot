name: Run OKX 4H Inverted Hammer Bot

on:
  schedule:
    # 매 4시간 마감 후 1분 뒤 실행 (KST 01:01, 05:01, 09:01, 13:01, 17:01, 21:01)
    # UTC 기준: 16:01, 20:01, 00:01, 04:01, 08:01, 12:01
    - cron: '1 0,4,8,12,16,20 * * *'
  workflow_dispatch: # 수동 실행 지원

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install ccxt pandas requests

      - name: Run 4H bot script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot_4h.py
